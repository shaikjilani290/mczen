# McZEN AI reverse proxy (TEMPLATE - not deployed, not validated on a live host).
# Replace app.example.com and the certificate paths, then validate with `nginx -t` on the target host.
# Requires nginx >= 1.9.5 built with http_v2_module (Ubuntu 24.04's stock 1.24.0 qualifies;
# the standalone `http2 on;` directive would need >= 1.25.1 and is NOT used).
# Install BOTH snippets before use (see DEPLOYMENT.md):
#   deploy/nginx/mczen-api-proxy.conf       -> /etc/nginx/snippets/mczen-api-proxy.conf
#   deploy/nginx/mczen-security-headers.conf -> /etc/nginx/snippets/mczen-security-headers.conf
# Layout assumed:
#   /var/www/mczen/current/        -> frontend/dist (index.html, assets/, widget.js)
#   127.0.0.1:3000                 -> NestJS backend (PORT=3000), bound to loopback only

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# One zone per concern; the backend also rate limits, this only absorbs floods before they reach Node.
limit_req_zone $binary_remote_addr zone=mczen_api:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=mczen_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=mczen_conn:10m;

upstream mczen_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    # Let's Encrypt HTTP-01 challenges may be added here; everything else goes to HTTPS.
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` is the compatible form for nginx 1.24.x (Ubuntu 24.04 ships
    # 1.24.0). The standalone `http2 on;` directive requires nginx >= 1.25.1. On
    # nginx >= 1.25.1 this listen parameter is deprecated but still works (warning only).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    root /var/www/mczen/current;
    index index.html;

    # Security headers for every response that declares none of its own.
    # Locations below that add any header of their own re-include the snippet,
    # because nginx add_header inheritance stops at the first nested add_header.
    # HSTS is intentionally NOT enabled here yet; see the snippet and DEPLOYMENT.md section 3.
    include /etc/nginx/snippets/mczen-security-headers.conf;

    client_max_body_size 12m;      # knowledge document uploads; backend enforces 10 MB per file
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    limit_conn mczen_conn 50;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- Widget loader: embedded cross-origin by customer sites ----
    # Short cache so a rollback or fix reaches embedders quickly. Versioned copies (widget.<hash>.js) may be cached long.
    location = /widget.js {
        include /etc/nginx/snippets/mczen-security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        # Required so customer sites may load the script cross-origin.
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files /widget.js =404;
    }

    # ---- React app: hashed assets are immutable ----
    location /assets/ {
        include /etc/nginx/snippets/mczen-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- Voice WebSocket (mczen-voice.v1) ----
    # Live voice sessions live in one backend process: this location MUST reach the same instance for the life of a
    # session (single upstream, or ip_hash/consistent-hash sticky routing). Not horizontally scalable.
    location = /api/voice/stream {
        include /etc/nginx/snippets/mczen-security-headers.conf;
        proxy_pass http://mczen_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;     # the backend validates Origin; never strip or rewrite it
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                 # long-lived socket; the app enforces its own idle timeout
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;                           # keep tickets/handshake data out of access logs
        limit_req zone=mczen_api burst=10 nodelay;
    }

    # ---- Auth endpoints: tighter throttle ----
    location /api/auth/ {
        limit_req zone=mczen_auth burst=10 nodelay;
        include /etc/nginx/snippets/mczen-api-proxy.conf;
    }

    # ---- Readiness: allow local monitors only ----
    location = /api/health/ready {
        allow 127.0.0.1;
        allow ::1;
        # allow <monitoring-subnet>;
        deny all;
        include /etc/nginx/snippets/mczen-api-proxy.conf;
    }

    # ---- API ----
    location /api/ {
        limit_req zone=mczen_api burst=60 nodelay;
        include /etc/nginx/snippets/mczen-api-proxy.conf;
    }

    # ---- SPA fallback: HTML is never cached so a new release is picked up immediately ----
    location / {
        include /etc/nginx/snippets/mczen-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

# mczen-api-proxy.conf (proxy_pass, forwarding headers, timeouts, no-store) lives
# separately; see deploy/nginx/mczen-api-proxy.conf. It includes
# mczen-security-headers.conf, so every proxied API response carries the same
# security headers as the static locations.

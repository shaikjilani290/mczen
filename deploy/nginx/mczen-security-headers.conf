# McZEN security headers — shared snippet.
# Install as /etc/nginx/snippets/mczen-security-headers.conf.
#
# Include this snippet at server level AND inside every location that defines
# its own add_header: nginx stops inheriting server-level add_header directives
# for any location that declares even one add_header of its own.
#
# HSTS is deliberately NOT enabled here. Do not turn it on before HTTPS is
# verified working on the target host (see DEPLOYMENT.md section 3): the header
# is cached by browsers and is hard to revoke. When HTTPS is verified, uncomment
# the single line below in THIS file — every server block and location that
# includes this snippet (or inherits from one that does) picks it up at once.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The dashboard needs the microphone; everything else is denied.
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;

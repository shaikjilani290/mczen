# Install as /etc/nginx/snippets/mczen-api-proxy.conf (included by mczen.conf).
# Includes the shared security headers so every proxied API response carries the
# same set as the static locations (X-Content-Type-Options is NOT repeated here
# to avoid emitting duplicate headers).
include /etc/nginx/snippets/mczen-security-headers.conf;
proxy_pass http://mczen_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header Origin $http_origin;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (never append) X-Forwarded-For: clients cannot inject spoofed
# entries, and the backend trusts forwarding headers only from this proxy
# (MCZEN_TRUST_PROXY=127.0.0.1 in production).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;          # agent/Ollama replies can be slow
proxy_send_timeout 60s;
add_header Cache-Control "no-store" always;
